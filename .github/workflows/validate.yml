name: Validate static game runtime

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Extract runtime module
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const html = readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script type="module">([\s\S]*?)<\/script>/g)];
          if (scripts.length !== 1) throw new Error('Expected exactly one runtime module in index.html');
          if (!html.includes('assets/warrior.glb')) throw new Error('Warrior GLB loader path is missing');
          writeFileSync('/tmp/npnop-runtime.mjs', scripts[0][1]);
          NODE
      - name: Check JavaScript syntax
        run: node --check /tmp/npnop-runtime.mjs
