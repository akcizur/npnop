name: Deploy static content to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Python for the generated character
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate rigged warrior GLB
        run: |
          python -m pip install --disable-pip-version-check --quiet numpy trimesh
          gzip -dc tools/warrior_builder.py.gz > /tmp/warrior_builder.py
          python /tmp/warrior_builder.py assets/warrior.glb
          test -s assets/warrior.glb

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
